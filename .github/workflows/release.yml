# A pushed version tag (v0.9.1, …) becomes a GitHub release, its notes taken from the tag's own message. GitHub
# Actions publishes it, so the release names no person's account. Only GitHub's own `gh` runs here, no other action.
# Started by hand (Actions, "Run workflow") for a tag pushed before this file worked.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to release (v0.9.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # gh reads a tag's message only from a local clone; GitHub's API gives it without one
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message |
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file - --title "Estia ${TAG#v}"
