# A pushed version tag (v0.9.1, …) becomes a GitHub release, its notes taken from the tag's own message. GitHub
# Actions publishes it, so the release names no person's account. Only GitHub's own `gh` runs here, no other action.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag --title "Estia ${TAG#v}"
